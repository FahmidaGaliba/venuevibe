<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VenueVibe — Sign Up</title>
    <!-- Google Font: Geist -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700;800;900&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="Signup.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
</head>
<body>
    <div class="container">
         <div class="logo-section">
             <a href="LandingPage.php" class="brand-link" title="Back to Home">
                 <h2>VenueVibe</h2>
             </a>
             <p>Simplify your campus logistics.</p>
         </div>

         <div class="signup-card card">
            <h2>Create Account</h2>
            <p class="subtitle">
                Join the community to start booking venues
            </p>

            <!-- Alert notification container -->
            <div id="alertBox" class="alert-box" style="display: none;" role="alert"></div>

            <form id="signupForm" action="signup.php" method="POST">
                <div class="form-group">
                    <label for="fullname">Full Name</label>
                    <div class="input-box input">
                        <i class="fa-regular fa-user"></i>
                        <input type="text" id="fullname" name="fullname" placeholder="Full name" autocomplete="name" required>
                    </div>
                </div>

                <div class="form-group">
                    <label for="email">University Email</label>
                    <div class="input-box input">
                        <i class="fa-regular fa-envelope"></i>
                        <input type="email" id="email" name="email" placeholder="student@uiu.ac.bd" autocomplete="email" required>
                    </div>
                </div>

                <div class="form-group">
                    <label for="role">Select Your Role</label>
                    <div class="input-box input select-box">
                        <i class="fa-solid fa-graduation-cap"></i>
                        <select name="role" id="role" required>
                            <option value="Student">Student</option>
                            <option value="Faculty">Faculty</option>
                        </select>
                        <i class="fa-solid fa-chevron-down chevron-icon"></i>
                    </div>
                </div>

                <div class="form-group">
                    <label for="passwordInput">Password</label>
                    <div class="input-box input">
                        <i class="fa-solid fa-lock"></i>
                        <input type="password" name="password" id="passwordInput" placeholder="••••••••" minlength="8" autocomplete="new-password" required>
                        <button type="button" class="eye-btn" id="togglePassword" aria-label="Toggle password visibility">
                            <i class="fa-regular fa-eye eye"></i>
                        </button>
                    </div>
                    <span class="helper-text">Must be at least 8 characters long</span>
                </div>

                <div class="checkbox">
                    <label class="checkbox-container">
                        <input type="checkbox" name="terms" id="terms" required>
                        <span class="label-text">
                            I agree to the 
                            <a href="#">Terms of Service</a>
                            and 
                            <a href="#">Privacy Policy</a>
                        </span>
                    </label>
                </div>

                <button type="submit" class="btn transition-all" id="signupBtn">
                    Create Account
                </button>
            </form>

            <p class="login-text">
                Already have an account?
                <a href="login.php">Log In</a>
            </p>
         </div>

         <div class="footer-links">
            <a href="#">Privacy Policy</a>
            <span>•</span>
            <a href="#">Support</a>
            <span>•</span>
            <a href="#">Terms</a>
        </div>
    </div>
    <script src="Signup.js"></script>
</body>
</html>
