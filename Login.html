<body>
    <div class="container">

            <p>Campus Management System</p>
        </div>

        <div class="login-card card">
             <div class="switch-btn">
                <button type="button" id="userBtn" class="active transition-all">
                    I am a User
                </button>
                <button type="button" id="adminBtn" class="transition-all">
                    I am an Admin
                </button>
             </div>

             <h3 class="loginTitle" id="Title">User Login</h3>
    
             <!-- Alert notification container -->
             <div id="alertBox" class="alert-box" style="display: none;" role="alert"></div>

             <form id="loginform" action="login.php" method="POST" novalidate>
                 <div class="form-group">
                     <label id="emailLabel" for="emailInput">University Email</label>
                     <div class="input-box input">
                        <i class="fa-regular fa-envelope"></i>
                        <input type="email" id="emailInput" name="email" placeholder="student@uiu.ac.bd" autocomplete="email" required>
                     </div>
                 </div>
    
                 <div class="form-group">
                     <div class="password-type">
                        <label for="passwordInput">Password</label>
                        <a href="#" class="forgot-link">Forgot Password?</a>
                     </div>
                     <div class="input-box input">
                        <i class="fa-solid fa-lock"></i>
                        <input type="password" name="password" id="passwordInput" placeholder="••••••••" autocomplete="current-password" required>
                        <button type="button" class="eye-btn" id="togglePassword" aria-label="Toggle password visibility">
                            <i class="fa-regular fa-eye eye"></i>
                        </button>
                     </div>
                 </div>
    
                 <div class="remember">
                    <label class="checkbox-container">
                        <input type="checkbox" name="remember" id="rememberMe">
                        <span class="label-text">Remember me</span>
                    </label>
                 </div>
    
                 <button type="submit" class="login-button transition-all" id="loginBtn">
                    Log In
                 </button>
             </form>
